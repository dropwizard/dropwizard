---
version: 2
jobs:
  build:
    working_directory: ~/dropwizard
    environment:
      JAVA_OPTS: -Xms512m -Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    docker:
      # yamllint disable-line rule:line-length
      - image: cimg/openjdk:21.0.8@sha256:4a801120973f503e4e2c2c83b8ee25f1fec7935c1fa3c455fb61f5773b5af7ae
    steps:
      - checkout
      - restore_cache:
          key: dropwizard-{{ checksum "pom.xml" }}
      - run: ./mvnw --no-transfer-progress -V -B -ff
          -Dsurefire.rerunFailingTestsCount=1 install
      - save_cache:
          paths:
            - ~/.m2
          key: dropwizard-{{ checksum "pom.xml" }}
      - run:
          name: Save test results
          command: |
            mkdir -p ~/junit/
            mv ~/dropwizard/*/target/surefire-reports/*.xml ~/junit/
          when: always
      - store_test_results:
          path: ~/junit
      - store_artifacts:
          path: ~/junit
