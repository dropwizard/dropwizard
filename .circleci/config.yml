---
version: 2
jobs:
  build:
    working_directory: ~/dropwizard
    environment:
      JAVA_OPTS: -Xms512m -Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    docker:
      # yamllint disable-line rule:line-length
      - image: cimg/openjdk:25.0.4@sha256:e84fdf864ef652a845c7c05ebd8a9d468700a8202a8545a22e5a7229ae5762cd
    steps:
      - checkout
      - restore_cache:
          key: dropwizard-{{ checksum "pom.xml" }}
      - run: ./mvnw --no-transfer-progress -V -B -ff
          -Dsurefire.rerunFailingTestsCount=1 install
      - save_cache:
          paths:
            - ~/.m2
          key: dropwizard-{{ checksum "pom.xml" }}
      - run:
          name: Save test results
          command: |
            mkdir -p ~/junit/
            mv ~/dropwizard/*/target/surefire-reports/*.xml ~/junit/
          when: always
      - store_test_results:
          path: ~/junit
      - store_artifacts:
          path: ~/junit
